# ============================================================
# InfoMpemba: Full TЗ-compliant configuration
# RTX 5070 Ti Laptop (sm_120, PyTorch nightly cu128)
# ============================================================

experiment:
  name: "mpemba_fisher_tz_compliant"
  num_runs: 1000
  max_iterations: 2000
  eval_interval: 20          # Fisher every 20 steps (balance speed vs resolution)
  base_seed: 42

model:
  architecture: "MLP"
  layers: [784, 256, 128, 10]
  activation: "tanh"
  bias: true

data:
  dataset: "FashionMNIST"
  batch_size: 16             # ТЗ REQUIREMENT: small batch -> heavy-tailed noise
  val_samples_kl: 10000
  data_dir: "./data"

optimizer:
  type: "LangevinFisher"     # ТЗ: Fisher-preconditioned Langevin
  lr: 0.01
  momentum: 0.0
  noise_scale: 1.0

initialization:
  cold_noise_std: 0.005      # Will be auto-tuned if KL(cold) >= 0.5
  hot_gain_multiplier: 3.0
  hot_laplace_scale: 0.5
  ref_epochs: 50
  ref_lr: 0.001
  ref_target_loss: 0.05

hardware:
  device: "cuda"
  num_workers: 0             # Windows: 0 is faster due to spawn overhead
  deterministic: false       # Disabled for speed (nightly build compat)
  mixed_precision: false     # Keep FP32 for numerical stability

output:
  results_dir: "./results"
  parquet_file: "trajectories_tz_compliant.parquet"
  theta_star_file: "theta_star.pt"
  log_interval: 50
